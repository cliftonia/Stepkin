name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint 0.53.0
        run: |
          curl -fsSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.53.0/portable_swiftlint.zip
          mkdir -p "$HOME/bin" && unzip -q swiftlint.zip -d "$HOME/bin"
          test "$("$HOME/bin/swiftlint" version)" = "0.53.0"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint lint --strict --quiet
      - name: Doc checker
        run: python3 Tools/doc_lint.py

  watch:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      SIM_DEVICE: Apple Watch Ultra 4 (49mm)
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-${{ runner.os }}-xcode27.1-${{ hashFiles('imon.xcodeproj/project.pbxproj') }}
      - name: Build
        run: >
          xcodebuild build -project imon.xcodeproj -scheme "imon Watch App"
          -destination "generic/platform=watchOS Simulator" -quiet
      - name: Boot simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl runtime list
          for attempt in $(seq 1 36); do
            xcrun simctl bootstatus "$SIM_DEVICE" -b && break
            [ "$attempt" = 36 ] && exit 1
            echo "runtime not ready (attempt $attempt); waiting"
            xcrun simctl shutdown "$SIM_DEVICE" || true
            sleep 10
          done
          echo "Booted after $attempt attempts"
      - name: Test
        run: >
          xcodebuild test -project imon.xcodeproj -scheme "imon Watch App"
          -destination "platform=watchOS Simulator,name=$SIM_DEVICE"
          -only-testing "imon Watch AppTests" -quiet
      - name: List simulators on failure
        if: failure()
        run: xcrun simctl list devices available
