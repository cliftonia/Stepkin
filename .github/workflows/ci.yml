name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint 0.53.0
        run: |
          curl -fsSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.53.0/portable_swiftlint.zip
          mkdir -p "$HOME/bin" && unzip -q swiftlint.zip -d "$HOME/bin"
          test "$("$HOME/bin/swiftlint" version)" = "0.53.0"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint lint --strict --quiet
      - name: Doc checker
        run: python3 Tools/doc_lint.py
      - name: Package imports
        run: "! grep -rnE \"^import (SwiftUI|WatchKit|UIKit|HealthKit|WeatherKit|WidgetKit|UserNotifications)\" Packages/StepkinKit/Sources"

  watch:
    runs-on: xcode-27
    # A lost runner (no steps, no log) is only reaped at this limit plus about five minutes.
    timeout-minutes: 30
    env:
      SIM_DEVICE_TYPE: Apple Watch Ultra 4 (49mm)
      # The LCD snapshot references were recorded on watchOS 27.0; newer runtimes on the image
      # render a few glyph pixels differently, so the test watch is pinned to the same runtime.
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.watchOS-27-0
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-${{ runner.os }}-xcode27.1-${{ hashFiles('Stepkin.xcodeproj/project.pbxproj') }}
      - name: Build
        run: >
          xcodebuild build -project Stepkin.xcodeproj -scheme "Stepkin Watch App"
          -destination "generic/platform=watchOS Simulator" -quiet
      # The image's watches are paired with iPhones, and xcodebuild then waits on the
      # phone's instruments service; a fresh, unpaired watch has no phone to wait on.
      - name: Boot simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl runtime list
          for attempt in $(seq 1 36); do
            if udid=$(xcrun simctl create "CI Watch" "$SIM_DEVICE_TYPE" "$SIM_RUNTIME") \
              && xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b; then
              break
            fi
            if [ "$attempt" = 36 ]; then
              xcrun simctl runtime list
              exit 1
            fi
            echo "runtime not ready (attempt $attempt); waiting"
            if [ -n "$udid" ]; then xcrun simctl delete "$udid" || true; fi
            sleep 10
          done
          echo "Booted $udid after $attempt attempts"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      # One retry, and only when the test runner never started; a failing test fails at once.
      - name: Test
        timeout-minutes: 20
        run: |
          for attempt in 1 2; do
            result="$RUNNER_TEMP/tests-$attempt.xcresult"
            set +e
            xcodebuild test -project Stepkin.xcodeproj -scheme "Stepkin Watch App" \
              -destination "platform=watchOS Simulator,id=$SIM_UDID" \
              -resultBundlePath "$result" \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
              -maximum-test-execution-time-allowance 120 \
              -collect-test-diagnostics never 2>&1 | tee "$RUNNER_TEMP/test-$attempt.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" = 0 ]; then exit 0; fi
            if ! grep -qE "never finished bootstrapping|Early unexpected exit|failed to establish communication|Lost connection to test process" \
              "$RUNNER_TEMP/test-$attempt.log"; then
              exit "$status"
            fi
            echo "::warning::the test runner failed to launch (attempt $attempt)"
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl boot "$SIM_UDID" && xcrun simctl bootstatus "$SIM_UDID" -b
          done
          exit 1
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-xcresult
          path: ${{ runner.temp }}/tests-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: List simulators on failure
        if: failure()
        run: xcrun simctl list devices available

  package-tests:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Package build, warnings as errors
        run: swift build --package-path Packages/StepkinKit --build-tests -Xswiftc -warnings-as-errors
      - name: Package tests
        run: swift test --package-path Packages/StepkinKit
