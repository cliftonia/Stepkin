name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint 0.53.0
        run: |
          curl -fsSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.53.0/portable_swiftlint.zip
          mkdir -p "$HOME/bin" && unzip -q swiftlint.zip -d "$HOME/bin"
          test "$("$HOME/bin/swiftlint" version)" = "0.53.0"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint lint --strict --quiet
      - name: Doc checker
        run: python3 Tools/doc_lint.py
      - name: Package imports
        run: "! grep -rnE \"^import (SwiftUI|WatchKit|UIKit|HealthKit|WeatherKit|WidgetKit|UserNotifications)\" Packages/StepkinKit/Sources"

  watch:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      SIM_DEVICE: Apple Watch Ultra 4 (49mm)
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-${{ runner.os }}-xcode27.1-${{ hashFiles('imon.xcodeproj/project.pbxproj') }}
      - name: Build
        run: >
          xcodebuild build -project imon.xcodeproj -scheme "imon Watch App"
          -destination "generic/platform=watchOS Simulator" -quiet
      - name: Boot simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl runtime list
          for attempt in $(seq 1 36); do
            xcrun simctl boot "$SIM_DEVICE" && xcrun simctl bootstatus "$SIM_DEVICE" -b && break
            if [ "$attempt" = 36 ]; then
              xcrun simctl runtime list
              exit 1
            fi
            echo "runtime not ready (attempt $attempt); waiting"
            xcrun simctl shutdown "$SIM_DEVICE" || true
            sleep 10
          done
          echo "Booted after $attempt attempts"
      - name: Test
        timeout-minutes: 15
        run: >
          xcodebuild test -project imon.xcodeproj -scheme "imon Watch App"
          -destination "platform=watchOS Simulator,name=$SIM_DEVICE"
          -only-testing "imon Watch AppTests"
          -resultBundlePath "$RUNNER_TEMP/tests.xcresult"
          -test-timeouts-enabled YES -default-test-execution-time-allowance 60
          -maximum-test-execution-time-allowance 120
          -collect-test-diagnostics never
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-xcresult
          path: ${{ runner.temp }}/tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: List simulators on failure
        if: failure()
        run: xcrun simctl list devices available

  package-tests:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Package build, warnings as errors
        run: swift build --package-path Packages/StepkinKit --build-tests -Xswiftc -warnings-as-errors
      - name: Package tests
        run: swift test --package-path Packages/StepkinKit
